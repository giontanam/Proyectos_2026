<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <h2>Iniciar Sesión</h2>

        <form id="loginForm">

            <input 
                type="email" 
                id="email" 
                placeholder="Correo"
                required
            >

            <input 
                type="password" 
                id="password" 
                placeholder="Contraseña"
                required
            >

            <button type="submit">
                Ingresar
            </button>

        </form>

        <p id="mensaje"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
